# Copy to the host that runs the bot, next to .env and data/app.pem.
services:
  peppec-bot:
    image: ghcr.io/peppecoli/peppec-bot:1
    env_file: .env
    volumes:
      # Holds the app's private key (app.pem) and the last processed Telegram update
      - ./data:/data
      # Optional: the Claude Code login that shows the Claude usage on the dashboard
      - ./claude:/claude
    ports:
      # The dashboard, off unless DASHBOARD_PASSWORD is set in .env. Reachable from this machine
      # only, unless .env sets DASHBOARD_PORT to the port to open on the network
      - "${DASHBOARD_PORT:-127.0.0.1:8737}:8737"
    restart: unless-stopped
