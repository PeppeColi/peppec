# Reusable workflow: the queue orchestrator and the agent.
# The host repository calls it from its own agent.yml, which keeps the triggers,
# the concurrency group and the permissions (see examples/agent.yml).
name: agent
on:
  workflow_call:
    inputs:
      engine_ref:
        description: Tag or commit of the engine to run; must match the ref after "@" in the caller's "uses"
        type: string
        default: main
      engine_repository:
        description: Repository that holds the engine (change it only for a fork)
        type: string
        default: PeppeColi/peppec
      force:
        description: Ignore the work window
        type: boolean
        default: false
      ci_check:
        description: Name of the check run that must pass before the review
        type: string
        default: ci / ci
      ci_workflow:
        description: File name of the host's CI workflow, used to fetch the logs of failed checks
        type: string
        default: ci.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      PEPPEC_AGENT_TOKEN:
        required: false
      PEPPEC_APP_PRIVATE_KEY:
        required: false
      PEPPEC_TELEGRAM_BOT_TOKEN:
        required: false
      PEPPEC_TELEGRAM_CHAT_ID:
        required: false

env:
  REPO: ${{ github.repository }}
  TZ_NAME: ${{ vars.PEPPEC_TZ_NAME }}
  CONTROL_ISSUE: ${{ vars.PEPPEC_CONTROL_ISSUE }}
  # The branch the agent starts from and its pull requests are merged into
  BASE_BRANCH: ${{ vars.PEPPEC_BASE_BRANCH || 'main' }}
  # Names of the agent's branches and of the feature branches (see template in scripts/lib.sh)
  PEPPEC_BRANCHES: ${{ vars.PEPPEC_BRANCHES }}
  # End-to-end tests of a feature, run by CI on its pull request into the base branch
  PEPPEC_E2E_FEATURE: ${{ vars.PEPPEC_E2E_FEATURE }}
  # Only the specifications you wrote get a feature branch (spec_of in scripts/lib.sh)
  OWNER_LOGIN: ${{ vars.PEPPEC_OWNER_LOGIN }}
  # With OWNER_LOGIN, the only authors whose ready issues the queue builds
  APP_LOGIN: ${{ vars.PEPPEC_APP_LOGIN }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  CTL: _ctl/scripts

jobs:
  decide:
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.d.outputs.action }}
      issue: ${{ steps.d.outputs.issue }}
      pr: ${{ steps.d.outputs.pr }}
      sha: ${{ steps.d.outputs.sha }}
      size: ${{ steps.d.outputs.size }}
      round: ${{ steps.d.outputs.round }}
      ci_tries: ${{ steps.d.outputs.ci_tries }}
      reason: ${{ steps.d.outputs.reason }}
      minutes: ${{ steps.d.outputs.minutes }}
      branch: ${{ steps.d.outputs.branch }}
      base: ${{ steps.d.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: _ctl
          sparse-checkout: scripts
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PEPPEC_APP_CLIENT_ID || vars.PEPPEC_APP_ID }}
          private-key: ${{ secrets.PEPPEC_APP_PRIVATE_KEY }}
      - id: d
        run: bash "$CTL/decide.sh"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          WORK_START_HOUR: ${{ vars.PEPPEC_WORK_START_HOUR }}
          WORK_END_HOUR: ${{ vars.PEPPEC_WORK_END_HOUR }}
          MAX_REVIEW_ROUNDS: ${{ vars.PEPPEC_MAX_REVIEW_ROUNDS }}
          LARGE_FROM_ROUND: ${{ vars.PEPPEC_LARGE_FROM_ROUND }}
          MAX_CI_ATTEMPTS: ${{ vars.PEPPEC_MAX_CI_ATTEMPTS }}
          MAX_ISSUE_MINUTES: ${{ vars.PEPPEC_MAX_ISSUE_MINUTES }}
          STALL_MINUTES: ${{ vars.PEPPEC_STALL_MINUTES }}
          QUOTA_RETRY_MINUTES: ${{ vars.PEPPEC_QUOTA_RETRY_MINUTES }}
          CI_CHECK: ${{ inputs.ci_check }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_MERGED: ${{ github.event.pull_request.merged }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          FORCE: ${{ inputs.force }}
          # For the message sent when the last sub-issue of a feature is closed
          TELEGRAM_BOT_TOKEN: ${{ secrets.PEPPEC_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PEPPEC_TELEGRAM_CHAT_ID }}
      - if: failure()
        run: |
          [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$(date +%-M)" -lt 15 ] || exit 0
          source "$CTL/lib.sh"
          notify "The decide step failed: $RUN_URL"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PEPPEC_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PEPPEC_TELEGRAM_CHAT_ID }}

  control:
    needs: decide
    if: contains(fromJSON('["stop","merge","notify_ready","rerequest"]'), needs.decide.outputs.action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: _ctl
          sparse-checkout: scripts
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PEPPEC_APP_CLIENT_ID || vars.PEPPEC_APP_ID }}
          private-key: ${{ secrets.PEPPEC_APP_PRIVATE_KEY }}
      - run: bash "$CTL/control.sh"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.PEPPEC_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PEPPEC_TELEGRAM_CHAT_ID }}
          ACTION: ${{ needs.decide.outputs.action }}
          ISSUE: ${{ needs.decide.outputs.issue }}
          PR: ${{ needs.decide.outputs.pr }}
          SHA: ${{ needs.decide.outputs.sha }}
          AGENT_TOKEN: ${{ secrets.PEPPEC_AGENT_TOKEN }}
          REASON: ${{ needs.decide.outputs.reason }}

  # The agent's work is split in three jobs, so the code the agent runs (tests, build scripts,
  # dependencies) never shares a runner with a token that can write:
  # - prepare: with the app's token, labels the issue and writes the agent's task;
  # - agent: Claude, with the Claude token and the workflow's read-only token only; its result is
  #   a patch, uploaded as data;
  # - publish: on a fresh runner, checks the patch and pushes it, with your token and the app's.
  prepare:
    needs: decide
    if: contains(fromJSON('["start","fix_ci","fix_review"]'), needs.decide.outputs.action)
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.task.outputs.title }}
      kind: ${{ steps.task.outputs.kind }}
    env:
      ACTION: ${{ needs.decide.outputs.action }}
      ISSUE: ${{ needs.decide.outputs.issue }}
      PR: ${{ needs.decide.outputs.pr }}
      BRANCH: ${{ needs.decide.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: _ctl
          sparse-checkout: scripts
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PEPPEC_APP_CLIENT_ID || vars.PEPPEC_APP_ID }}
          private-key: ${{ secrets.PEPPEC_APP_PRIVATE_KEY }}
      - id: task
        run: bash "$CTL/task.sh"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CI_WORKFLOW: ${{ inputs.ci_workflow }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task
          path: .agent/
          include-hidden-files: true
          retention-days: 1

  agent:
    needs: [decide, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.decide.outputs.minutes) }}
    outputs:
      start: ${{ steps.ws.outputs.start }}
      start_tree: ${{ steps.ws.outputs.start_tree }}
      merge_parents: ${{ steps.ws.outputs.merge_parents }}
      clock: ${{ steps.clock.outputs.start }}
      outcome: ${{ steps.claude.outcome }}
      protected_paths: ${{ steps.cfg.outputs.protected_paths }}
      never_commit: ${{ steps.cfg.outputs.never_commit }}
    env:
      ACTION: ${{ needs.decide.outputs.action }}
      ISSUE: ${{ needs.decide.outputs.issue }}
      # The issue's branch and the branch it is based on: BASE_BRANCH, or a feature branch
      BRANCH: ${{ needs.decide.outputs.branch }}
      BASE: ${{ needs.decide.outputs.base }}
      # Removes the tokens from the environment of the commands Claude runs
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ vars.PEPPEC_BASE_BRANCH || 'main' }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: _ctl
          persist-credentials: false
      # Runs while the workspace is still on the base branch: the configuration never comes
      # from the agent's branch. It also copies the chosen preset to ./_preset
      - id: cfg
        run: bash "$CTL/config.sh"
        env:
          SIZE: ${{ needs.decide.outputs.size }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: task
          path: .agent
      - id: ws
        run: bash "$CTL/workspace.sh"
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ needs.prepare.outputs.kind }}
          # A sync work unit starts with a merge made by the workflow
          GIT_NAME: ${{ vars.PEPPEC_AGENT_GIT_NAME }}
          GIT_EMAIL: ${{ vars.PEPPEC_AGENT_GIT_EMAIL }}
      - uses: ./_preset
        with:
          options: ${{ steps.cfg.outputs.options }}
      # Optional setup action of the host repository (extra_setup in .github/peppec.yml)
      - if: steps.cfg.outputs.extra_setup != ''
        uses: ./_extra
      # With CLAUDE_CODE_SUBPROCESS_ENV_SCRUB, Claude Code runs every command in a sandbox that
      # needs bubblewrap and socat; without them the Bash tool refuses to run anything. Ubuntu
      # 24.04 also restricts the user namespaces bubblewrap uses. The same setup as
      # claude-code-action's own step for untrusted users
      - name: Sandbox for the agent's commands
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap socat && break
            echo "apt-get attempt $i failed, retrying..."; sleep 5
          done
          command -v bwrap > /dev/null && command -v socat > /dev/null
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read only: the agent never pushes, the publish job does
          github_token: ${{ github.token }}
          # The action refuses runs started by a bot, except the ones listed here
          allowed_bots: "${{ steps.ws.outputs.app_slug }},coderabbitai"
          prompt: ${{ steps.cfg.outputs.prompt }}
          claude_args: >-
            --model ${{ steps.cfg.outputs.model }}
            --max-turns 150
            ${{ steps.cfg.outputs.tool_args }}
      # From here on the runner is not trusted: the result is data, checked by the publish job
      - run: bash "$CTL/collect.sh"
        env:
          RESULT: ${{ runner.temp }}/result
          START: ${{ steps.ws.outputs.start }}
          OUTCOME: ${{ steps.claude.outcome }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          NEVER_COMMIT: ${{ steps.cfg.outputs.never_commit }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result
          path: ${{ runner.temp }}/result/
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: [decide, prepare, agent]
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ needs.decide.outputs.action }}
      ISSUE: ${{ needs.decide.outputs.issue }}
      PR: ${{ needs.decide.outputs.pr }}
      ROUND: ${{ needs.decide.outputs.round }}
      CI_TRIES: ${{ needs.decide.outputs.ci_tries }}
      BRANCH: ${{ needs.decide.outputs.branch }}
      BASE: ${{ needs.decide.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ vars.PEPPEC_BASE_BRANCH || 'main' }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: _ctl
          sparse-checkout: scripts
          persist-credentials: false
      # Outside the workspace: the two folders never mix with the repository's files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: task
          path: ${{ runner.temp }}/task
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: result
          path: ${{ runner.temp }}/result
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PEPPEC_APP_CLIENT_ID || vars.PEPPEC_APP_ID }}
          private-key: ${{ secrets.PEPPEC_APP_PRIVATE_KEY }}
      - run: bash "$CTL/after.sh"
        env:
          GH_TOKEN: ${{ secrets.PEPPEC_AGENT_TOKEN }}
          AGENT_TOKEN: ${{ secrets.PEPPEC_AGENT_TOKEN }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.PEPPEC_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PEPPEC_TELEGRAM_CHAT_ID }}
          GIT_NAME: ${{ vars.PEPPEC_AGENT_GIT_NAME }}
          GIT_EMAIL: ${{ vars.PEPPEC_AGENT_GIT_EMAIL }}
          TASK_DIR: ${{ runner.temp }}/task
          RESULT: ${{ runner.temp }}/result
          START: ${{ needs.agent.outputs.start }}
          START_TREE: ${{ needs.agent.outputs.start_tree }}
          MERGE_PARENTS: ${{ needs.agent.outputs.merge_parents }}
          OUTCOME: ${{ needs.agent.outputs.outcome }}
          TITLE: ${{ needs.prepare.outputs.title }}
          CLAUDE_START: ${{ needs.agent.outputs.clock }}
          PROTECTED_PATHS: ${{ needs.agent.outputs.protected_paths }}
          NEVER_COMMIT: ${{ needs.agent.outputs.never_commit }}

  timeout:
    needs: [decide, prepare, agent, publish]
    if: >-
      always() && contains(fromJSON('["cancelled","failure"]'), needs.prepare.result)
      || always() && contains(fromJSON('["cancelled","failure"]'), needs.agent.result)
      || always() && contains(fromJSON('["cancelled","failure"]'), needs.publish.result)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: _ctl
          sparse-checkout: scripts
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PEPPEC_APP_CLIENT_ID || vars.PEPPEC_APP_ID }}
          private-key: ${{ secrets.PEPPEC_APP_PRIVATE_KEY }}
      - run: bash "$CTL/control.sh"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.PEPPEC_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PEPPEC_TELEGRAM_CHAT_ID }}
          ACTION: stop
          ISSUE: ${{ needs.decide.outputs.issue }}
          PR: ${{ needs.decide.outputs.pr }}
          SKIP_IF_BLOCKED: ${{ needs.agent.result != 'cancelled' }}
          REASON: >-
            ${{ needs.agent.result == 'cancelled' && 'time limit reached'
            || needs.prepare.result == 'failure' && 'the prepare job failed'
            || needs.agent.result == 'failure' && 'the agent job failed'
            || 'the publish job failed' }}
