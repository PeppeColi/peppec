# Reusable workflow: the CI of a host repository. It runs the setup of the preset and the
# check commands, the same ones the agent is told to run (see examples/ci.yml).
# The resulting check run is named "<caller job> / ci", normally "ci / ci".
# On the pull request of a feature branch into the base branch (PEPPEC_BRANCHES) it also runs the
# end-to-end tests: "ci / e2e_feature" (PEPPEC_E2E_FEATURE, read by the agent workflow) and
# "ci / e2e_all" (PEPPEC_E2E_ALL, to require in the ruleset of the base branch). On any other
# pull request those two jobs succeed without running anything.
name: ci
on:
  workflow_call:
    inputs:
      engine_ref:
        description: Tag or commit of the engine to run; must match the ref after "@" in the caller's "uses"
        type: string
        default: main
      engine_repository:
        description: Repository that holds the engine (change it only for a fork)
        type: string
        default: PeppeColi/peppec

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: _ctl
          persist-credentials: false
      # Agent branches are checked with the configuration of the base branch, so the agent
      # cannot weaken its own checks; any other branch uses its own configuration. Their names
      # follow PEPPEC_BRANCHES: the same rule as the workflow that merges them
      - id: who
        if: github.head_ref != ''
        run: |
          source _ctl/scripts/lib.sh
          if is_agent_branch "$HEAD_REF"; then echo "agent=true" >> "$GITHUB_OUTPUT"; fi
        env:
          HEAD_REF: ${{ github.head_ref }}
          PEPPEC_BRANCHES: ${{ vars.PEPPEC_BRANCHES }}
      - if: steps.who.outputs.agent == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: _base
          sparse-checkout: .github
          persist-credentials: false
      - id: cfg
        run: bash _ctl/scripts/config.sh
        env:
          PEPPEC_CONFIG: ${{ steps.who.outputs.agent == 'true' && '_base/.github/peppec.yml' || '.github/peppec.yml' }}
      - uses: ./_preset
        with:
          options: ${{ steps.cfg.outputs.options }}
      # Optional setup action of the host repository (extra_setup in .github/peppec.yml)
      - if: steps.cfg.outputs.extra_setup != ''
        uses: ./_extra
      - run: bash -euxo pipefail -c "$CHECK"
        env:
          CHECK: ${{ steps.cfg.outputs.check }}

  e2e_feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: _ctl
          persist-credentials: false
      - id: f
        run: bash _ctl/scripts/e2e.sh plan feature
        env:
          COMMAND: ${{ vars.PEPPEC_E2E_FEATURE }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_BRANCH: ${{ vars.PEPPEC_BASE_BRANCH || 'main' }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PEPPEC_BRANCHES: ${{ vars.PEPPEC_BRANCHES }}
      # A feature branch is not the agent's: it is checked with its own configuration, like CI
      - if: steps.f.outputs.run == 'true'
        id: cfg
        run: bash _ctl/scripts/config.sh
      - if: steps.f.outputs.run == 'true'
        uses: ./_preset
        with:
          options: ${{ steps.cfg.outputs.options }}
      - if: steps.f.outputs.run == 'true' && steps.cfg.outputs.extra_setup != ''
        uses: ./_extra
      - if: steps.f.outputs.run == 'true'
        run: bash -euxo pipefail -c "$E2E"
        env:
          E2E: ${{ steps.f.outputs.command }}

  e2e_all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: _ctl
          persist-credentials: false
      - id: f
        run: bash _ctl/scripts/e2e.sh plan all
        env:
          COMMAND: ${{ vars.PEPPEC_E2E_ALL }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_BRANCH: ${{ vars.PEPPEC_BASE_BRANCH || 'main' }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PEPPEC_BRANCHES: ${{ vars.PEPPEC_BRANCHES }}
      # A feature branch is not the agent's: it is checked with its own configuration, like CI
      - if: steps.f.outputs.run == 'true'
        id: cfg
        run: bash _ctl/scripts/config.sh
      - if: steps.f.outputs.run == 'true'
        uses: ./_preset
        with:
          options: ${{ steps.cfg.outputs.options }}
      - if: steps.f.outputs.run == 'true' && steps.cfg.outputs.extra_setup != ''
        uses: ./_extra
      - if: steps.f.outputs.run == 'true'
        run: bash -euxo pipefail -c "$E2E"
        env:
          E2E: ${{ steps.f.outputs.command }}
