# Reusable workflow: the morning summary on Telegram (see examples/summary.yml).
name: summary
on:
  workflow_call:
    inputs:
      engine_ref:
        description: Tag or commit of the engine to run; must match the ref after "@" in the caller's "uses"
        type: string
        default: main
      engine_repository:
        description: Repository that holds the engine (change it only for a fork)
        type: string
        default: PeppeColi/peppec
    secrets:
      PEPPEC_APP_PRIVATE_KEY:
        required: true
      PEPPEC_TELEGRAM_BOT_TOKEN:
        required: true
      PEPPEC_TELEGRAM_CHAT_ID:
        required: true

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.engine_repository }}
          ref: ${{ inputs.engine_ref }}
          path: _ctl
          sparse-checkout: scripts
          persist-credentials: false
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PEPPEC_APP_ID }}
          private-key: ${{ secrets.PEPPEC_APP_PRIVATE_KEY }}
      - run: bash _ctl/scripts/summary.sh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          TZ_NAME: ${{ vars.PEPPEC_TZ_NAME }}
          SUMMARY_HOUR: ${{ vars.PEPPEC_SUMMARY_HOUR }}
          CLAUDE_TOKEN_EXPIRES: ${{ vars.PEPPEC_CLAUDE_TOKEN_EXPIRES }}
          AGENT_TOKEN_EXPIRES: ${{ vars.PEPPEC_AGENT_TOKEN_EXPIRES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.PEPPEC_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PEPPEC_TELEGRAM_CHAT_ID }}
