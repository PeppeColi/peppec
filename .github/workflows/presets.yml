# Checks the presets on every pull request: the rules of CONTRIBUTING.md that can be
# verified automatically, then setup and check commands of each preset on its fixture.
# It runs with "pull_request", so code from forks never sees a secret.
name: presets
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      presets: ${{ steps.list.outputs.presets }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/lint-presets.sh
      # Syntax of the scripts and of the command line, which must also run on the bash 3.2 of macOS
      - run: |
          for f in scripts/*.sh cli/peppec; do bash -n "$f"; done
          shellcheck -S error -s bash scripts/*.sh cli/peppec
          bash cli/peppec help > /dev/null
      - id: list
        run: echo "presets=$(ls presets | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  fixture:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.lint.outputs.presets) }}
    steps:
      # Same layout as a host repository: the project at the root, the engine in _ctl
      - uses: actions/checkout@v4
        with: { path: _ctl }
      - id: cfg
        run: |
          cp -R "_ctl/presets/$PRESET/fixture/." .
          if [ ! -f .github/peppec.yml ]; then
            mkdir -p .github
            printf 'preset: %s\n' "$PRESET" > .github/peppec.yml
          fi
          bash _ctl/scripts/config.sh
        env:
          PRESET: ${{ matrix.preset }}
      - uses: ./_preset
        with:
          options: ${{ steps.cfg.outputs.options }}
      - if: steps.cfg.outputs.extra_setup != ''
        uses: ./_extra
      - run: bash -euxo pipefail -c "$CHECK"
        env:
          CHECK: ${{ steps.cfg.outputs.check }}
