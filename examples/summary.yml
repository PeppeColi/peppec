# Copy to .github/workflows/summary.yml in your repository.
# GitHub cron runs in UTC: list the UTC hours that can match SUMMARY_HOUR in your time zone
# with and without daylight saving (07:00 and 08:00 UTC for 09:00 in Central Europe).
# The script sends the summary only on the run that matches.
name: summary
on:
  schedule:
    - cron: '0 7,8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary:
    uses: PeppeColi/peppec/.github/workflows/summary.yml@v2
    with:
      engine_ref: v2
    secrets:
      PEPPEC_APP_PRIVATE_KEY: ${{ secrets.PEPPEC_APP_PRIVATE_KEY }}
      PEPPEC_TELEGRAM_BOT_TOKEN: ${{ secrets.PEPPEC_TELEGRAM_BOT_TOKEN }}
      PEPPEC_TELEGRAM_CHAT_ID: ${{ secrets.PEPPEC_TELEGRAM_CHAT_ID }}
