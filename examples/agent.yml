# Copy to .github/workflows/agent.yml in your repository.
# Keep the ref after "@" and engine_ref identical.
name: agent
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: [ci]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the work window
        type: boolean
        default: false

# Only one run at a time: each run reads the state back from GitHub and picks one move
concurrency:
  group: agent
  cancel-in-progress: false

# Read only: the jobs that write use the app's token and PEPPEC_AGENT_TOKEN
permissions:
  contents: read

jobs:
  agent:
    if: github.event.pull_request.head.repo.fork != true
    uses: PeppeColi/peppec/.github/workflows/agent.yml@v2
    with:
      engine_ref: v2
      force: ${{ inputs.force || false }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PEPPEC_AGENT_TOKEN: ${{ secrets.PEPPEC_AGENT_TOKEN }}
      PEPPEC_APP_PRIVATE_KEY: ${{ secrets.PEPPEC_APP_PRIVATE_KEY }}
      PEPPEC_TELEGRAM_BOT_TOKEN: ${{ secrets.PEPPEC_TELEGRAM_BOT_TOKEN }}
      PEPPEC_TELEGRAM_CHAT_ID: ${{ secrets.PEPPEC_TELEGRAM_CHAT_ID }}
