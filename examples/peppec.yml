# Copy to .github/peppec.yml in your repository. Always read from the base branch
# (PEPPEC_BASE_BRANCH, main when not set); a feature branch keeps its own copy.
preset: rust-v1

# Optional overrides of the preset defaults (see presets/<name>/preset.yml in the engine).
# description, check, notes, allowed_tools and disallowed_tools replace the preset's value;
# protected_paths and never_commit are added to the preset's lists. The engine always
# protects .github, .claude, CLAUDE.md, AGENTS.md, docs/agents and docs/adr.
#
# description: Rust command line tool
# check: |
#   cargo fmt --all -- --check
#   cargo test --all-features
# protected_paths:
#   - Makefile
#
# The model for each issue size (labels "size: S", "size: M", "size: L"; M without a label).
# These are the defaults; a value is a model alias or a full model ID.
# models:
#   s: haiku
#   m: sonnet
#   l: opus
#
# Options of the preset, listed in its README:
# options:
#   php-version: "8.3"
#
# A setup action of this repository, run after the preset's: services, system packages.
# It must live under .github/.
# extra_setup: .github/actions/services
